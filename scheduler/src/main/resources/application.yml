spring:
  application:
    name: scheduler
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://192.168.0.242:9984/mosonic_dev_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SCHEDULER_PORT:8003}

scheduler:
  api-key: ${SCHEDULER_API_KEY:change-me-shared-secret}
  redis-channel: ${SCHEDULER_REDIS_CHANNEL:mosonic:scheduler:events}
  poll-interval-ms: ${SCHEDULER_POLL_INTERVAL_MS:5000}
  default-timezone: ${SCHEDULER_DEFAULT_TIMEZONE:UTC}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
